name: Build Web

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apps/web/**"
      - "libs/**"
      - "package*.json"
      - ".github/workflows/build-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "libs/**"
      - "package*.json"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (Bravura Safe self-hosted production)
        working-directory: apps/web
        run: npm run build:bravura:selfhost:prod

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build/
          if-no-files-found: error
