name: Build CLI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apps/cli/**"
      - "libs/**"
      - "package*.json"
      - ".github/workflows/build-cli.yml"
  pull_request:
    paths:
      - "apps/cli/**"
      - "libs/**"
      - "package*.json"
      - ".github/workflows/build-cli.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build CLI - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-22.04
            script: dist:oss:lin
            artifact: apps/cli/dist/oss/linux/bsafe
          - os: Windows
            runner: windows-2022
            script: dist:oss:win
            artifact: apps/cli/dist/oss/windows/bsafe.exe
          - os: macOS
            runner: macos-13
            script: dist:oss:mac
            artifact: apps/cli/dist/oss/macos/bsafe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI (${{ matrix.os }})
        working-directory: apps/cli
        run: npm run ${{ matrix.script }}

      - name: Upload CLI artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
