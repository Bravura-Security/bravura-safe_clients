<div class="tw-mb-4 tw-flex tw-items-start tw-justify-between page-header">
    <div>
      <bit-breadcrumbs *ngIf="showBreadcrumbs">
        <bit-breadcrumb
        [route]="[]"
        [queryParams]="{ organizationId: organization.id, collectionId: null }"
        queryParamsHandling="merge"
      >
        {{ organization.name }}
      <span>
          {{ "vault" | i18n | lowercase }}
        </span>
      </bit-breadcrumb>

      <ng-container>
        <bit-breadcrumb
          *ngFor="let collection of collections"
          icon="fa-cube"
          [route]="[]"
          [queryParams]="{ collectionId: collection.id }"
          queryParamsHandling="merge"
        >
          {{ collection.name }}
        </bit-breadcrumb>
      </ng-container>
    </bit-breadcrumbs>

  <h1 class="tw-mb-0 tw-mt-1 tw-flex tw-items-center tw-space-x-2">
    <i
      *ngIf="filter.collectionId !== undefined"
      class="fa fa-cube"
      aria-hidden="true"
    ></i>
    <span>{{ title }}</span>
  <ng-container slot="title-suffix">
    <ng-container
      *ngIf="
        collection != null && (canEditCollection || canDeleteCollection || canViewCollectionInfo)
      "
    >
        <button
          bitIconButton="fa-angle-down"
          [bitMenuTriggerFor]="editCollectionMenu"
          size="small"
          type="button"
        aria-haspopup="true"
        ></button>
        <bit-menu #editCollectionMenu>
        <ng-container *ngIf="canEditCollection">
          <button
            type="button"
            bitMenuItem
            (click)="editCollection(CollectionDialogTabType.Info, false)"
          >
            <i class="fa fa-fw fa-pencil-square-o" aria-hidden="true"></i>
            {{ "editInfo" | i18n }}
          </button>
          <button
            type="button"
            bitMenuItem
            (click)="editCollection(CollectionDialogTabType.Access, false)"
          >
            <i class="fa fa-fw fa-users" aria-hidden="true"></i>
            {{ "access" | i18n }}
          </button>
        </ng-container>
        <ng-container *ngIf="!canEditCollection && canViewCollectionInfo">
          <button
            type="button"
            bitMenuItem
            (click)="editCollection(CollectionDialogTabType.Info, true)"
          >
            <i class="fa fa-fw fa-pencil-square" aria-hidden="true"></i>
            {{ "viewInfo" | i18n }}
          </button>
          <button
            type="button"
            bitMenuItem
            (click)="editCollection(CollectionDialogTabType.Access, true)"
          >
            <i class="fa fa-fw fa-users" aria-hidden="true"></i>
            {{ "viewAccess" | i18n }}
          </button>
        </ng-container>
        <button type="button" *ngIf="canDeleteCollection" bitMenuItem (click)="deleteCollection()">
            <span class="tw-text-danger">
              <i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
              {{ "delete" | i18n }}
            </span>
          </button>
        </bit-menu>
      </ng-container>
      <small *ngIf="loading">
          <i
            class="fa fa-spinner fa-spin text-muted"
            title="{{ 'loading' | i18n }}"
            aria-hidden="true"
          ></i>
        <span class="tw-sr-only">{{ "loading" | i18n }}</span>
      </small>
  </ng-container>
    </h1>
  </div>

  <bit-search
    *ngIf="restrictProviderAccessFlag && organization?.isProviderUser && !organization?.isMember"
    class="tw-grow"
    [ngModel]="searchText"
    (ngModelChange)="onSearchTextChanged($event)"
    [placeholder]="'searchCollection' | i18n"
  ></bit-search>

  <div *ngIf="filter.type !== 'trash' && filter.collectionId !== Unassigned" class="tw-shrink-0">
    <div *ngIf="canCreateCipher && canCreateCollection" appListDropdown>
      <button
        bitButton
        buttonType="primary"
        type="button"
        [bitMenuTriggerFor]="addOptions"
        id="newItemDropdown"
        appA11yTitle="{{ 'new' | i18n }}"
      >
        {{ "new" | i18n }}<i class="fa fa-angle-down tw-ml-2" aria-hidden="true"></i>
      </button>
      <bit-menu #addOptions aria-labelledby="newItemDropdown">
        <button type="button" bitMenuItem (click)="addCipher()">
          <i class="fa fa-fw fa-globe" aria-hidden="true"></i>
          {{ "item" | i18n }}
        </button>
        <button type="button" bitMenuItem (click)="addCollection()">
          <i class="fa fa-fw fa-cube" aria-hidden="true"></i>
          {{ "collection" | i18n }}
        </button>
      </bit-menu>
    </div>
    <button
      *ngIf="canCreateCipher && !canCreateCollection"
      type="button"
      bitButton
      buttonType="primary"
      (click)="addCipher()"
    >
      <i class="fa fa-plus fa-fw" aria-hidden="true"></i>
      {{ "newItem" | i18n }}
    </button>

    <button
      *ngIf="canCreateCollection && !canCreateCipher"
      type="button"
      bitButton
      buttonType="primary"
      (click)="addCollection()"
    >
      <i class="fa fa-plus fa-fw" aria-hidden="true"></i>
      {{ "newCollection" | i18n }}
    </button>
  </div>
</div>
