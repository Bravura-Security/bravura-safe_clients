<div class="d-flex page-header">
  <h1>
    {{ "billingHistory" | i18n }}
  </h1>
  <button
    type="button"
    bitButton
    buttonType="secondary"
    (click)="load()"
    class="tw-ml-auto"
    *ngIf="firstLoaded"
    [disabled]="loading"
  >
    <i class="fa fa-refresh fa-fw" [ngClass]="{ 'fa-spin': loading }" aria-hidden="true"></i>
    {{ "refresh" | i18n }}
  </button>
</div>
<!--
</app-header>

<bit-container>
-->
<ng-container *ngIf="!firstLoaded && loading">
  <i
    class="fa fa-spinner fa-spin tw-text-muted"
    title="{{ 'loading' | i18n }}"
    aria-hidden="true"
  ></i>
    <span class="tw-sr-only">{{ "loading" | i18n }}</span>
</ng-container>
<ng-container *ngIf="billing">
  <app-billing-history [billing]="billing"></app-billing-history>
</ng-container>
