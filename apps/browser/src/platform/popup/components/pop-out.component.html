<ng-container *ngIf="show && !useRefreshVariant">
  <button type="button" (click)="expand()" appA11yTitle="{{ 'popOutNewWindow' | i18n }}">
    <i class="fa fa-external-link fa-rotate-270 fa-lg fa-fw" aria-hidden="true"></i>
  </button>
</ng-container>
<ng-container *ngIf="show && useRefreshVariant">
  <button
    bitIconButton="fa-level-up"
    size="small"
    type="button"
    appA11yTitle="{{ 'popOutNewWindow' | i18n }}"
    [title]="'popOutNewWindow' | i18n"
    (click)="expand()"
  ></button>
</ng-container>
